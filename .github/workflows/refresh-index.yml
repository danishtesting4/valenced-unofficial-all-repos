name: Keep the combined index up to date

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-combined-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check the index generator
        run: node --test tests/*.test.mjs
      - name: Refresh from upstream
        run: node scripts/build-index.mjs
      - name: Publish index changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json source-map.json
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            git commit -m "Refresh aggregated plugin index"
            git push
          fi
